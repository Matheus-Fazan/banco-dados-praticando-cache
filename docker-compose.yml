services:
  postgres:
    image: postgres:16-alpine
    container_name: redis-cache-postgres
    environment:
      POSTGRES_DB: redisCache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O arquivo ja contem o CREATE TABLE e os INSERTs iniciais.
      - ./produtos.txt:/docker-entrypoint-initdb.d/01-produtos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redisCache"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-cache-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
